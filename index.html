<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT TO TKA SMA - Sistem Ujian Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CONTAINER UTAMA -->
    <div class="container">
        
        <!-- HEADER UJIAN -->
        <header class="header">
            <h2>CBT TO TKA SMA</h2>
            <div id="timerBadge" class="timer-badge hidden">
                ⏳ Waktu: <span id="timer">--:--:--</span>
            </div>
        </header>

        <!-- AREA LOGIN / FORM IDENTITAS -->
        <div id="loginArea" class="card">
            <h3>Identitas Peserta Ujian</h3>
            <form id="formLogin" onsubmit="mulaiUjian(event)">
                <div class="form-group">
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" required placeholder="Masukkan nama lengkap">
                </div>
                <div class="form-group">
                    <label for="kelas">Kelas:</label>
                    <select id="kelas" required>
                        <option value="">-- Pilih Kelas --</option>
                        <option value="12_SMA">Kelas 12 SMA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="asal">Asal Sekolah:</label>
                    <input type="text" id="asal" required placeholder="Nama sekolah/madrasah">
                </div>
                <div class="form-group">
                    <label for="nomor">Nomor Peserta:</label>
                    <input type="text" id="nomor" required placeholder="Contoh: TKA-001">
                </div>
                <div class="form-group">
                    <label for="mapel">Mata Pelajaran / Subtes:</label>
                    <input type="text" id="mapel" value="TKA (IND, ING, MTK)" readonly>
                </div>
                <div class="form-group">
                    <label for="password">Token / Password Ujian:</label>
                    <input type="password" id="password" required placeholder="Masukkan password kelas">
                </div>
                <button type="submit" class="btn btn-primary btn-block">🚀 Mulai Ujian Sekarang</button>
            </form>
        </div>

        <!-- AREA UJIAN / SOAL -->
        <div id="quizArea" class="card" style="display: none;">
            <div id="infoPesertaBox" class="info-peserta-bar"></div>
            
            <div id="soalContainer">
                <!-- Soal & Pilihan Jawaban Di-render via JavaScript -->
            </div>

            <!-- CONTROLS NAVIGASI SOAL -->
            <div id="controls" class="controls-bar" style="display: none;">
                <button id="prevBtn" class="btn btn-secondary">⬅️ Sebelumnya</button>
                <label class="ragu-checkbox">
                    <input type="checkbox" id="raguBtn" onchange="toggleRaguRagu()"> 🟨 Ragu-ragu
                </label>
                <button id="nextBtn" class="btn btn-primary">Berikutnya ➡️</button>
                <button id="finishBtn" class="btn btn-danger" style="display: none;" onclick="konfirmasiSelesai()">🏁 Selesai Ujian</button>
            </div>

            <!-- GRID NAVIGASI NOMOR SOAL -->
            <div id="questionNav" class="question-nav-grid" style="display: none;"></div>
        </div>

    </div>

    <!-- MODAL PERINGATAN PELANGGARAN (SHOCK ALERT) -->
    <div class="peringatan-overlay" id="customPeringatan">
        <div class="peringatan-box">
            <div class="peringatan-icon">🚨</div>
            <div class="peringatan-title">PERINGATAN KERAS!</div>
            <div class="peringatan-text" id="peringatanText"></div>
            <button class="peringatan-btn" onclick="tutupPeringatan()">Saya Mengerti & Tidak Akan Mengulangi</button>
        </div>
    </div>

    <!-- SCRIPT MODULAR (LOAD SESUAI URUTAN) -->
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/scoring.js"></script>
    <script src="js/api.js"></script>
    <script src="js/proctoring.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
